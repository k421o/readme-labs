[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "readme-labs"
version = "0.1.0.dev0"
description = "Deterministic README collection and evaluation tools for readme-labs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Karlton Suits"}]
dependencies = [
  "jsonschema[format]>=4.25,<5",
  "markdown-it-py>=4,<5",
]

[project.scripts]
readme-lab = "readme_lab.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/readme_lab"]

[tool.hatch.build.targets.wheel.force-include]
"domain/taxonomy-v1.json" = "readme_lab/data/taxonomy-v1.json"
"domain/readme-observation-v1.schema.json" = "readme_lab/data/readme-observation-v1.schema.json"
"domain/readme-observation-v2.schema.json" = "readme_lab/data/readme-observation-v2.schema.json"
"evals/task-capsule-v1.schema.json" = "readme_lab/data/task-capsule-v1.schema.json"
"evals/review-response-v1.schema.json" = "readme_lab/data/review-response-v1.schema.json"
"evals/review-scorecard-v1.schema.json" = "readme_lab/data/review-scorecard-v1.schema.json"
"corpus/manifest-item-v1.schema.json" = "readme_lab/data/manifest-item-v1.schema.json"
"intake/source-manifest-v1.schema.json" = "readme_lab/data/source-manifest-v1.schema.json"
"intake/source-manifest-v2.schema.json" = "readme_lab/data/source-manifest-v2.schema.json"
"intake/ingestion-job-v1.schema.json" = "readme_lab/data/ingestion-job-v1.schema.json"
"intake/ingestion-selection-v1.schema.json" = "readme_lab/data/ingestion-selection-v1.schema.json"
"intake/ingestion-inventory-v1.schema.json" = "readme_lab/data/ingestion-inventory-v1.schema.json"
"intake/finalization-receipt-v1.schema.json" = "readme_lab/data/finalization-receipt-v1.schema.json"
"intake/git-migration-receipt-v1.schema.json" = "readme_lab/data/git-migration-receipt-v1.schema.json"
"intake/external-action-plan-v1.schema.json" = "readme_lab/data/external-action-plan-v1.schema.json"
"candidates/candidate-v1.schema.json" = "readme_lab/data/candidate-v1.schema.json"
"experiments/schemas/evaluator-v1.schema.json" = "readme_lab/data/evaluator-v1.schema.json"
"experiments/schemas/soft-agent-review-response-v1.schema.json" = "readme_lab/data/soft-agent-review-response-v1.schema.json"
"experiments/schemas/experiment-plan-v1.schema.json" = "readme_lab/data/experiment-plan-v1.schema.json"
"experiments/schemas/static-analyzer-v1.schema.json" = "readme_lab/data/static-analyzer-v1.schema.json"
"experiments/schemas/static-analysis-run-v1.schema.json" = "readme_lab/data/static-analysis-run-v1.schema.json"
"experiments/schemas/user-response-observation-v1.schema.json" = "readme_lab/data/user-response-observation-v1.schema.json"
"readmes/artifact-record-v1.schema.json" = "readme_lab/data/artifact-record-v1.schema.json"
"readmes/evidence-record-v1.schema.json" = "readme_lab/data/evidence-record-v1.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  "candidates/**/artifact",
  "intake/snapshots",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
