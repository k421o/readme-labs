[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "readme-labs"
version = "0.1.0.dev0"
description = "Deterministic README collection and evaluation tools for readme-labs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Karlton Suits"}]
dependencies = [
  "jsonschema[format]>=4.25,<5",
  "markdown-it-py>=4,<5",
]

[project.scripts]
readme-lab = "readme_lab.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/readme_lab"]

[tool.hatch.build.targets.wheel.force-include]
"domain/taxonomy-v1.json" = "readme_lab/data/taxonomy-v1.json"
"domain/readme-observation-v1.schema.json" = "readme_lab/data/readme-observation-v1.schema.json"
"evals/task-capsule-v1.schema.json" = "readme_lab/data/task-capsule-v1.schema.json"
"corpus/manifest-item-v1.schema.json" = "readme_lab/data/manifest-item-v1.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
